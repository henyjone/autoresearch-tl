[project]
name = "autoresearch-tl"
version = "0.1.0"
description = "Autonomous research for underwater acoustic transmission loss prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
